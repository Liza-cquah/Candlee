
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Candlee</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #fff8f2;
      color: #674d48;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 36px 28px;
      background: #fffdfb;
      border: 1px solid #f2dfd6;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(130, 87, 75, 0.09);
      text-align: center;
    }

    .logo {
      margin-bottom: 8px;
      font-size: 38px;
    }

    h1 {
      margin: 0 0 10px;
      color: #a66f78;
      font-size: 36px;
      font-weight: normal;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #947b73;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ead7ce;
      border-radius: 12px;
      background: #fffaf7;
      color: #674d48;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #cb9da4;
      box-shadow: 0 0 0 3px rgba(203, 157, 164, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #c78f99;
      color: white;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #ae7480;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .text-button {
      width: auto;
      margin: 14px 0 0;
      padding: 4px;
      background: transparent;
      color: #a66f78;
      font-size: 14px;
    }

    .text-button:hover {
      background: transparent;
      color: #80515b;
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0ed;
      color: #a13f38;
    }

    .message.success {
      background: #edf7ee;
      color: #3f7048;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      margin-top: 25px;
      color: #a18a80;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🕯️</div>
    <h1>Candlee</h1>

    <p class="subtitle" id="subtitle">
      A little space to grow, dream, and become.
    </p>

    <form id="authForm">
      <div class="field hidden" id="nameField">
        <label for="displayName">What should we call you?</label>
        <input
          id="displayName"
          type="text"
          placeholder="Your name"
          autocomplete="name"
        >
      </div>

      <div class="field" id="emailField">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="field hidden" id="confirmField">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="Enter your password again"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" id="submitButton">
        Sign In
      </button>
    </form>

    <button
      type="button"
      class="text-button"
      id="forgotButton"
    >
      Forgot your password?
    </button>

    <button
      type="button"
      class="text-button"
      id="switchButton"
    >
      Don't have an account? Sign up
    </button>

    <button
      type="button"
      class="text-button hidden"
      id="backButton"
    >
      Back to sign in
    </button>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <p class="footer">
      Take a breath. You're allowed to grow at your own pace. ♡
    </p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://snodsrcvlezthsenvrli.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Qv2gVkdWnjxP52zub-OLnA_7Teh9AYR";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const authForm = document.getElementById("authForm");
    const subtitle = document.getElementById("subtitle");
    const nameField = document.getElementById("nameField");
    const emailField = document.getElementById("emailField");
    const passwordField = document.getElementById("passwordField");
    const confirmField = document.getElementById("confirmField");

    const displayName = document.getElementById("displayName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    const submitButton = document.getElementById("submitButton");
    const switchButton = document.getElementById("switchButton");
    const forgotButton = document.getElementById("forgotButton");
    const backButton = document.getElementById("backButton");
    const message = document.getElementById("message");

    let mode = "signin";
    let busy = false;

    function showMessage(text, type = "success") {
      message.textContent = text;
      message.className = "message show " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function setBusy(value) {
      busy = value;
      submitButton.disabled = value;
      submitButton.textContent = value
        ? "Please wait..."
        : getButtonText();
    }

    function getButtonText() {
      if (mode === "signup") return "Create Account";
      if (mode === "reset") return "Send Reset Link";
      if (mode === "update") return "Update Password";
      return "Sign In";
    }

    function setMode(newMode) {
      mode = newMode;
      clearMessage();

      const signingUp = mode === "signup";
      const resetting = mode === "reset";
      const updating = mode === "update";

      nameField.classList.toggle("hidden", !signingUp);
      confirmField.classList.toggle("hidden", !signingUp && !updating);
      emailField.classList.toggle("hidden", updating);
      passwordField.classList.toggle("hidden", resetting);

      displayName.required = signingUp;
      confirmPassword.required = signingUp || updating;
      email.required = !updating;
      password.required = !resetting;

      password.autocomplete = signingUp || updating
        ? "new-password"
        : "current-password";

      submitButton.textContent = getButtonText();

      switchButton.classList.toggle(
        "hidden",
        resetting || updating
      );

      forgotButton.classList.toggle(
        "hidden",
        signingUp || resetting || updating
      );

      backButton.classList.toggle(
        "hidden",
        mode === "signin"
      );

      if (mode === "signup") {
        subtitle.textContent =
          "Create a little space just for you.";
        switchButton.textContent =
          "Already have an account? Sign in";
      } else if (mode === "reset") {
        subtitle.textContent =
          "We'll send you a link to reset your password.";
      } else if (mode === "update") {
        subtitle.textContent =
          "Choose a new password for your account.";
      } else {
        subtitle.textContent =
          "A little space to grow, dream, and become.";
        switchButton.textContent =
          "Don't have an account? Sign up";
      }
    }

    function goToDashboard() {
      // This function name is kept so existing calls still work.
      // Candlee now sends users to the homepage.
      window.location.href = new URL(
        "index.html",
        window.location.href
      ).href;
    }

    async function checkExistingSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        showMessage(error.message, "error");
        return;
      }

      if (data.session) {
        goToDashboard();
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (busy) return;

      clearMessage();
      setBusy(true);

      try {
        if (mode === "signup") {
          if (password.value !== confirmPassword.value) {
            showMessage("Your passwords don't match.", "error");
            return;
          }

          if (password.value.length < 6) {
            showMessage(
              "Please use a password with at least 6 characters.",
              "error"
            );
            return;
          }

          const { data, error } = await supabase.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              data: {
                display_name: displayName.value.trim()
              },
              emailRedirectTo: new URL(
                "index.html",
                window.location.href
              ).href
            }
          });

          if (error) throw error;

          if (data.session) {
            showMessage("Your account is ready! Welcome to Candlee.");
            window.location.href = new URL(
              "index.html",
              window.location.href
            ).href;
            return;
          }

          showMessage(
            "Your account has been created! Please check your email to confirm your account before signing in."
          );

          setMode("signin");
        } else if (mode === "signin") {
          const { data, error } =
            await supabase.auth.signInWithPassword({
              email: email.value.trim(),
              password: password.value
            });

          if (error) throw error;

          if (data.session) {
            goToDashboard();
          }
        } else if (mode === "reset") {
          const redirectTo = new URL(
            "signin.html",
            window.location.href
          ).href;

          const { error } = await supabase.auth.resetPasswordForEmail(
            email.value.trim(),
            { redirectTo }
          );

          if (error) throw error;

          showMessage(
            "If your account exists, a password reset email will be sent. Please check your inbox."
          );
        } else if (mode === "update") {
          if (password.value !== confirmPassword.value) {
            showMessage("Your passwords don't match.", "error");
            return;
          }

          if (password.value.length < 6) {
            showMessage(
              "Please use a password with at least 6 characters.",
              "error"
            );
            return;
          }

          const { error } = await supabase.auth.updateUser({
            password: password.value
          });

          if (error) throw error;

          showMessage(
            "Your password has been updated! Welcome back to Candlee."
          );

          setTimeout(() => {
            goToDashboard();
          }, 1200);
        }
      } catch (error) {
        showMessage(
          error.message || "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        setBusy(false);
      }
    });

    switchButton.addEventListener("click", () => {
      setMode(mode === "signin" ? "signup" : "signin");
    });

    forgotButton.addEventListener("click", () => {
      setMode("reset");
    });

    backButton.addEventListener("click", () => {
      setMode("signin");
    });

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        setMode("update");
        showMessage("Please choose your new password.");
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(
      window.location.hash.replace(/^#/, "")
    );

    const isRecovery =
      urlParams.get("type") === "recovery" ||
      hashParams.get("type") === "recovery";

    if (isRecovery) {
      setMode("update");
    } else {
      checkExistingSession();
    }
  </script>
</body>
</html>
