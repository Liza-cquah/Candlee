<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome to Candlee ♡</title>

  <style>
    :root {
      --cream: #fffaf5;
      --pink: #f4dce3;
      --dark-pink: #d88fa5;
      --brown: #624b42;
      --light-brown: #92776b;
      --border: #eadbd3;
      --green: #49765a;
      --red: #a94343;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--brown);
      background:
        radial-gradient(
          circle at top left,
          #f8e7eb,
          transparent 40%
        ),
        radial-gradient(
          circle at bottom right,
          #f4e5d5,
          transparent 40%
        ),
        var(--cream);
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-icon {
      font-size: 44px;

    }

    .brand h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 1px;
    }

    .brand p {
      margin-top: 8px;
      color: var(--light-brown);
      font-size: 15px;
    }

    .card {
      padding: 32px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 25px;
      box-shadow: 0 15px 45px rgba(98, 75, 66, 0.09);
    }

    .card h2 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: var(--light-brown);
      line-height: 1.6;
      margin: 0 0 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--cream);
      color: var(--brown);
      font-size: 15px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    input:focus {
      border-color: var(--dark-pink);
      box-shadow: 0 0 0 3px rgba(216, 143, 165, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    button:focus-visible {
      outline: 3px solid var(--dark-pink);
      outline-offset: 3px;
    }

    .primary {
      width: 100%;
      margin-top: 24px;
      background: var(--dark-pink);
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .primary:hover {
      background: #c87e95;
    }

    .text-button {
      display: block;
      margin: 13px auto 0;
      padding: 7px;
      background: transparent;
      color: var(--light-brown);
    }

    .switch-text {
      text-align: center;
      margin: 22px 0 0;
      color: var(--light-brown);
      font-size: 14px;
    }

    .switch-button {
      display: inline;
      padding: 0;
      background: transparent;
      color: #bd7089;
      font-size: 14px;
      font-weight: bold;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      background: #edf6ee;
      color: var(--green);
      border: 1px solid #d2e6d5;
    }

    .message.error {
      display: block;
      background: #fff0ef;
      color: var(--red);
      border: 1px solid #f0d2cf;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: var(--light-brown);
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 25px 20px;
      }

      .brand h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="brand">
      <div class="brand-icon">🕯️</div>
      <h1>Candlee</h1>
      <p>A little space for the life you're creating.</p>
    </header>

    <section class="card">

      <h2 id="formTitle">Welcome back ♡</h2>

      <p class="subtitle" id="formSubtitle">
        Your dreams, your goals, your little moments.
        Let's pick up where you left off.
      </p>

      <form id="authForm">

        <div id="nameGroup" class="hidden">
          <label for="displayName">What should we call you?</label>
          <input
            type="text"
            id="displayName"
            placeholder="Your name"
            autocomplete="name"
          >
        </div>

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password" id="passwordLabel">Password</label>
        <input
          type="password"
          id="password"
          placeholder="At least 8 characters"
          minlength="8"
          autocomplete="current-password"
          required
        >

        <div id="confirmGroup" class="hidden">
          <label for="confirmPassword">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Type your password again"
            minlength="8"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="primary" id="submitButton">
          Sign in ♡
        </button>

      </form>

      <button
        type="button"
        class="text-button"
        id="forgotButton"
      >
        Forgot your password?
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <p class="switch-text" id="switchText">
        <span id="switchPrompt">New to Candlee?</span>
        <button
          type="button"
          class="switch-button"
          id="switchButton"
        >Create an account</button>
      </p>

    </section>

    <footer class="footer">
      Made with love, just for your next chapter ♡
    </footer>

  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://snodsrcvlezthsenvrli.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Qv2gVkdWnjxP52zub-OLnA_7Teh9AYR";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let mode = "signin";
    let busy = false;

    const form = $("authForm");
    const submitButton = $("submitButton");
    const switchButton = $("switchButton");
    const forgotButton = $("forgotButton");
    const messageBox = $("message");

    function showMessage(text, type = "success") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function setBusy(value) {
      busy = value;

      submitButton.disabled = value;
      switchButton.disabled = value;
      forgotButton.disabled = value;

      if (value) {
        submitButton.textContent = "Please wait…";
      } else {
        updateForm();
      }
    }

    function updateForm() {
      $("nameGroup").classList.toggle(
        "hidden",
        mode !== "signup"
      );

      $("confirmGroup").classList.toggle(
        "hidden",
        mode !== "signup"
      );

      forgotButton.classList.toggle(
        "hidden",
        mode !== "signin"
      );

      $("formTitle").textContent =
        mode === "signup"
          ? "Your new beginning ♡"
          : mode === "reset"
          ? "Choose a new password ♡"
          : "Welcome back ♡";

      $("formSubtitle").textContent =
        mode === "signup"
          ? "Create your little corner of the world."
          : mode === "reset"
          ? "Choose a new password for your Candlee account."
          : "Your dreams, your goals, your little moments. Let's pick up where you left off.";

      submitButton.textContent =
        mode === "signup"
          ? "Create my account ♡"
          : mode === "reset"
          ? "Save new password ♡"
          : "Sign in ♡";

      $("switchPrompt").textContent =
        mode === "signup"
          ? "Already have an account?"
          : "New to Candlee?";

      switchButton.textContent =
        mode === "signup"
          ? "Sign in"
          : "Create an account";

      $("switchText").classList.toggle(
        "hidden",
        mode === "reset"
      );

      $("passwordLabel").textContent =
        mode === "reset" ? "New password" : "Password";

      $("password").placeholder =
        mode === "signin"
          ? "Your password"
          : "At least 8 characters";

      $("password").autocomplete =
        mode === "signin"
          ? "current-password"
          : "new-password";

      $("password").minLength = 8;

      $("confirmPassword").required = mode === "signup";
      $("displayName").required = mode === "signup";

      switchButton.disabled = busy;
      forgotButton.disabled = busy;
      submitButton.disabled = busy;
    }

    function changeMode(newMode) {
      if (busy) return;

      mode = newMode;
      form.reset();
      clearMessage();
      updateForm();
    }

    // This button stays in the page permanently.
    // It is not recreated when the form changes.
    switchButton.addEventListener("click", () => {
      if (busy) return;

      if (mode === "signin") {
        changeMode("signup");
      } else if (mode === "signup") {
        changeMode("signin");
      }
    });

    function goToDashboard() {
      window.location.href = new URL(
        "dashboard.html",
        window.location.href
      ).href;
    }

    async function checkExistingSession() {
      try {
        const { data, error } =
          await supabase.auth.getSession();

        if (error) {
          console.error("Session check failed:", error);
          return;
        }

        if (
          data.session &&
          !window.location.hash.includes("type=recovery")
        ) {
          goToDashboard();
          return;
        }

        if (window.location.hash.includes("type=recovery")) {
          mode = "reset";
          updateForm();

          showMessage(
            "Choose your new password below."
          );
        }
      } catch (error) {
        console.error("Could not check session:", error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (busy) return;

      clearMessage();

      const email = $("email").value.trim();
      const password = $("password").value;

      setBusy(true);

      try {
        if (mode === "signup") {
          const displayName = $("displayName").value.trim();
          const confirmPassword = $("confirmPassword").value;

          if (!displayName) {
            throw new Error("Please enter your name.");
          }

          if (password.length < 8) {
            throw new Error(
              "Your password must contain at least 8 characters."
            );
          }

          if (password !== confirmPassword) {
            throw new Error(
              "Your passwords don't match. Please try again!"
            );
          }

          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                display_name: displayName
              },
              emailRedirectTo: new URL(
                "signin.html",
                window.location.href
              ).href
            }
          });

          if (error) throw error;

          if (data.session) {
            showMessage(
              "Your account is ready! Welcome to Candlee ♡"
            );

            goToDashboard();
            return;
          }

          mode = "signin";
          form.reset();
          updateForm();

          showMessage(
            "Your sign-up request was received! Check your email for a confirmation link if email confirmation is enabled. After confirming, return here and sign in."
          );

        } else if (mode === "signin") {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showMessage("You're signed in! Welcome back ♡");
          goToDashboard();
          return;

        } else if (mode === "reset") {
          const { error } = await supabase.auth.updateUser({
            password
          });

          if (error) throw error;

          window.history.replaceState(
            null,
            "",
            window.location.pathname + window.location.search
          );

          mode = "signin";
          form.reset();
          updateForm();

          showMessage(
            "Your password has been updated! You can now sign in with your new password."
          );
        }

      } catch (error) {
        console.error("Candlee authentication error:", error);

        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        setBusy(false);
      }
    });

    forgotButton.addEventListener("click", async () => {
      if (busy) return;

      const email = $("email").value.trim();

      clearMessage();

      if (!email) {
        showMessage(
          "Enter your email address first, then click Forgot your password.",
          "error"
        );

        $("email").focus();
        return;
      }

      setBusy(true);

      try {
        const { error } =
          await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: new URL(
              "signin.html",
              window.location.href
            ).href
          });

        if (error) throw error;

        showMessage(
          "If an account exists for that email, a password reset link will be sent. Check your inbox."
        );

      } catch (error) {
        console.error("Password reset error:", error);

        showMessage(
          error.message ||
          "We couldn't send the reset email. Please try again.",
          "error"
        );
      } finally {
        setBusy(false);
      }
    });

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        mode = "reset";
        updateForm();

        showMessage(
          "You're in password reset mode. Choose your new password below."
        );
      }
    });

    updateForm();
    checkExistingSession();
  </script>

</body>
</html>
